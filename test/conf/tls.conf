# Mounted over /etc/nginx/conf.d/default.conf by the "TLS" scenario.
# The certificate is a throwaway self-signed one generated at test time into /certs.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
