# Mounted over /etc/nginx/conf.d/default.conf by the mp4 scenarios (CVE-2024-7347).
# /srv/video holds valid.mp4 and a malformed copy generated at test time.
server {
    listen 80;
    server_name _;

    location /video/ {
        alias /srv/video/;
        mp4;                      # enables ?start= seeking, the code path the patch changes
    }

    location = /ping {
        default_type text/plain;
        return 200 "alive\n";
    }
}
