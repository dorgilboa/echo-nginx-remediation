# Mounted over /etc/nginx/conf.d/default.conf in both containers by the "custom config" scenario.
server {
    listen 80;
    server_name _;

    add_header X-Echo-Test "custom" always;

    location / {
        default_type text/plain;
        return 200 "custom config ok\n";
    }

    # Raised body limit: a 5 MiB POST must be accepted.
    location /upload {
        client_max_body_size 20m;
        default_type text/plain;
        return 200 "upload ok\n";
    }

    # Tiny body limit: a 2 KiB POST must be rejected with 413.
    location /limited {
        client_max_body_size 1k;
        default_type text/plain;
        return 200 "should not get here\n";
    }
}
